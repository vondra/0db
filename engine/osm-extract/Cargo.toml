[package]
name = "osm-to-h3r4"
version = "0.1.0"
edition = "2021"

[dependencies]
osmpbf = "0.3"
h3o = "0.7"
arrow = { version = "54", features = ["ipc"] }
parquet = { version = "54", features = ["arrow"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
