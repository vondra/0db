[package]
name = "source-reader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
arrow = { version = "54", default-features = false, features = ["ipc", "ffi"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
h3o = "0.7"
noise-compute = { path = "../noise-compute" }
raster-reader = { path = "../raster-reader" }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
