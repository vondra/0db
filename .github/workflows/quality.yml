name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            pipeline/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: pipeline
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - run: ./scripts/check-fast.sh node

  rust:
    name: Rust acoustic kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # rust-toolchain.toml pins rustc, rustfmt, and clippy. The hosted runner's
      # rustup installs that exact toolchain on the first cargo invocation.
      - run: ./scripts/check-fast.sh rust
