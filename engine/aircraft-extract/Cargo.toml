[package]
name = "aircraft-extract"
version = "0.1.0"
edition = "2021"
description = "Aircraft pipeline — popup-first extraction (Stage 0..2C → per-R4 Arrow)"

[lib]
name = "aircraft_extract"
path = "src/lib.rs"

[[bin]]
name = "aircraft-extract"
path = "src/bin/aircraft_extract.rs"

[dependencies]
noise-compute = { path = "../noise-compute" }
raster-reader = { path = "../raster-reader" }
h3o = "0.7"
arrow = { version = "54", features = ["ipc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
tzf-rs = { version = "=1.2.0", default-features = false }
rayon = "1"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
