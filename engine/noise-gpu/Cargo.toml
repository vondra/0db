[package]
name = "noise-gpu"
version = "0.1.0"
edition = "2021"

# GPU backend for the surface scatter (docs/dev/gpu-ground-hybrid-plan.md).
# cudarc dynamically targets the CUDA driver; the .cu kernels are compiled to PTX
# at build time by build.rs via `nvcc -arch=sm_89`. cuda-12060 = highest bindings
# cudarc 0.12 ships; the 12.x driver API is forward-compatible with the box's 12.8.
[dependencies]
cudarc = { version = "0.12", default-features = false, features = ["driver", "nvrtc", "cuda-12060"] }
raster-reader = { path = "../raster-reader" }
heatmap-aircraft = { path = "../heatmap-aircraft" }
noise-compute = { path = "../noise-compute" }
h3o = "0.7"
anyhow = "1"
rayon = "1"

[lib]
name = "noise_gpu"
path = "src/lib.rs"

# Production batch runner: build a tile block's rail HM3 on the GPU (shared halo
# + binned kernel), validate vs baseline / write output, report throughput.
[[bin]]
name = "gpu-surface"
path = "src/gpu_surface.rs"

# E2 acceptance: GPU-vs-CPU byte-exact parity on the full surface path. Run by
# hand on a GPU host before a --gpu world build (see docs/dev/gpu-fp32-dda-plan.md).
[[bin]]
name = "e2-full"
path = "src/e2_full.rs"
