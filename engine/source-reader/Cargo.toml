[package]
name = "source-reader"
version = "0.1.0"
edition = "2021"

[features]
default = ["node"]
node = ["dep:napi", "dep:napi-derive"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", features = ["serde-json"], optional = true }
napi-derive = { version = "2", optional = true }
arrow = { version = "54", default-features = false, features = ["ipc", "ffi"] }
memmap2 = "0.9"
anyhow = "1"
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rstar = "0.12"
h3o = "0.7"
noise-compute = { path = "../noise-compute" }
raster-reader = { path = "../raster-reader" }
rayon = "1"
adsb-to-h3r4 = { path = "../adsb-to-h3r4" }
aircraft-tracks = { path = "../aircraft-tracks" }
# LRU bound for PALT_CACHE — keeps memory under control on a 24/7 server
# that browses globally (Czech alone has ~80 R4 hexes; EU ~1k; world ~25 k
# populated). At ~25 KB per cached raster, capacity 1024 ≈ 25 MB worst case.
lru = "0.12"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
