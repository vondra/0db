# Pin the toolchain so clippy/rustfmt/rustc rules are reproducible across every build
# host and CI worker — a lint or format rule change is then a reviewed toolchain bump,
# not silent drift in a future quality gate.
#
# This pins the rule/format/compiler VERSION, NOT numeric output: `.cargo/config.toml`
# sets `target-cpu=native`, so every binary is still rebuilt per host and parity-checked
# (AGENTS.md "rebuild every binary you'll run"). Pinning the toolchain ≠ binary determinism.
[toolchain]
channel = "1.96.0"
# Minimal matches the worker provisioning (`rustup --profile minimal`): when a build
# host auto-installs 1.96.0 on first build in this dir, fetch only rustc+cargo
# (+ the two components below) — not the default profile's rust-docs, dead weight on
# ephemeral build disks.
profile = "minimal"
components = ["clippy", "rustfmt"]
