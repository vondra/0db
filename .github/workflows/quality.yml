name: quality / Node

on:
  pull_request:
    paths:
      - .github/workflows/quality.yml
      - .claude/skills/check-*/**
      - .githooks/**
      - DATA_YEAR
      - benchmarks/**
      - frontend/**
      - pipeline/**
      - server/**
      - scripts/**
      - start.sh
  push:
    branches: [main]
    paths:
      - .github/workflows/quality.yml
      - .claude/skills/check-*/**
      - .githooks/**
      - DATA_YEAR
      - benchmarks/**
      - frontend/**
      - pipeline/**
      - server/**
      - scripts/**
      - start.sh

permissions:
  contents: read

concurrency:
  group: quality-node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            pipeline/package-lock.json
      - name: Install pipeline system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gdal-bin
          ogr2ogr --version
          # The worker-agent committer (scripts/world/agent.py region_tiles)
          # imports Python h3 v4; without it the committer swallows a
          # ModuleNotFoundError and silently drops every commit, so the
          # enospc regression's /tiles-push check can never pass (main red
          # 2026-07-16→17 until this landed). Same major as the fleet boxes.
          python3 -m pip install --quiet 'h3>=4,<5'
          python3 -c 'import h3; print("h3", h3.__version__)'
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: pipeline
      - name: Check committed whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - run: ./scripts/check-fast.sh node
